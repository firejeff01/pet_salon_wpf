name: Build MSI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write  # bump commit, push tag, create release + upload asset

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # 用預設 GITHUB_TOKEN 即可 push 回 main（contents: write）

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install WiX v5
        run: dotnet tool install --global wix --version 5.*

      # 只在 push 觸發時自動 +1 patch；workflow_dispatch 維持目前版本只 build MSI
      - name: Bump patch version in csproj
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $csproj = 'src/PetSalon.Wpf/PetSalon.Wpf.csproj'
          [xml]$xml = Get-Content $csproj
          $pg = $xml.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1
          if (-not $pg) { throw 'csproj <Version> missing' }

          $old = $pg.SelectSingleNode('Version').InnerText.Trim()
          $parts = $old.Split('.')
          if ($parts.Count -lt 3) { throw "Invalid version '$old', expected X.Y.Z" }
          $parts[2] = ([int]$parts[2] + 1).ToString()
          $new = $parts -join '.'
          $newFour = "$new.0"

          $pg.SelectSingleNode('Version').InnerText = $new
          $pg.SelectSingleNode('AssemblyVersion').InnerText = $newFour
          $pg.SelectSingleNode('FileVersion').InnerText = $newFour
          $xml.Save((Resolve-Path $csproj))

          Write-Host "Bumped $old -> $new"

      - name: Read version from csproj
        id: ver
        shell: pwsh
        run: |
          [xml]$xml = Get-Content 'src/PetSalon.Wpf/PetSalon.Wpf.csproj'
          $v = ($xml.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1).Trim()
          if (-not $v) { throw 'csproj <Version> missing' }
          "version=$v" | Out-File -Append -FilePath $env:GITHUB_OUTPUT
          Write-Host "version: $v"

      - name: Build MSI
        shell: pwsh
        run: ./tools/build-installer.ps1

      # App 內建的自動更新會先比對雜湊才執行 MSI，缺少 sidecar 就只會退回手動下載
      - name: Compute SHA256 sidecar
        id: hash
        shell: pwsh
        run: |
          $msi = Get-ChildItem 'out/PetSalon-Setup-v*.msi' | Select-Object -First 1
          if (-not $msi) { throw 'MSI not found' }
          $sha = (Get-FileHash $msi.FullName -Algorithm SHA256).Hash.ToLower()
          # 格式對齊 sha256sum：<hash>  <filename>
          "$sha  $($msi.Name)" | Out-File -FilePath "$($msi.FullName).sha256" -Encoding ascii -NoNewline
          "sha256=$sha" | Out-File -Append -FilePath $env:GITHUB_OUTPUT
          Write-Host "SHA256: $sha"

      - name: Upload MSI as artifact
        uses: actions/upload-artifact@v4
        with:
          name: PetSalon-Setup-v${{ steps.ver.outputs.version }}
          path: |
            out/PetSalon-Setup-v*.msi
            out/PetSalon-Setup-v*.msi.sha256
          if-no-files-found: error

      # build 成功後才把 bump 結果寫回 repo + 打 tag
      - name: Commit bumped csproj and push tag
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $ver = '${{ steps.ver.outputs.version }}'
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/PetSalon.Wpf/PetSalon.Wpf.csproj
          git commit -m "chore: bump version to v$ver [skip ci]"
          git tag "v$ver"
          git push origin HEAD:main
          git push origin "v$ver"

      - name: Create Release & attach MSI
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: 貳寶寵物美容工坊 v${{ steps.ver.outputs.version }}
          body: |
            ## 安裝

            1. 下載下方的 `PetSalon-Setup-v${{ steps.ver.outputs.version }}.msi`
            2. 在下載好的檔案上按右鍵 →「內容」→ 勾選最下方的「解除封鎖」→ 確定
            3. 點兩下安裝

            ※ 若略過步驟 2，會出現「Windows 已保護您的電腦」提示，
            點「其他資訊」→「仍要執行」即可，屬正常現象。

            已安裝舊版的話不必手動下載 —— 開啟程式後點上方橫幅的「立即更新」，
            程式會自行下載、驗證並安裝，不會出現上述提示。

            - Per-user 安裝（不需管理員權限）
            - 升級舊版會保留所有資料
            - 首次「產生 PDF」需網路下載 Chromium (~170 MB)

            ## 檔案校驗

            `PetSalon-Setup-v${{ steps.ver.outputs.version }}.msi` 的 SHA256：

            ```
            ${{ steps.hash.outputs.sha256 }}
            ```

            PowerShell 驗證：`Get-FileHash .\PetSalon-Setup-v${{ steps.ver.outputs.version }}.msi -Algorithm SHA256`
          files: |
            out/PetSalon-Setup-v*.msi
            out/PetSalon-Setup-v*.msi.sha256
          draft: false
          prerelease: false
